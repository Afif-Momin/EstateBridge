<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Region</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <div class="container">
        <h2>Select Your Location</h2>
        <p>Choose your country and state.</p>

        <!-- Manual City Input -->
       

        <!-- Country Dropdown -->
        <label for="country">Select Country:</label>
        <select id="country">
            <option value="" disabled selected>Select a country</option>
            <option value="US">United States</option>
            <option value="UK">United Kingdom</option>
            <option value="India">India</option>
            <option value="Canada">Canada</option>
            <option value="Germany">Germany</option>
        </select>

        <!-- State Dropdown (Hidden by Default) -->
        <label for="state" id="stateLabel" class="hidden">Select State:</label>
        <select id="state" class="hidden">
            <option value="" disabled selected>Select a state</option>
        </select>

        <button id="confirmLocation" class="btn">Confirm Location</button>
    </div>

    <!--  Firebase SDKs (No `type="module"`) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!--  Firebase Initialization -->
    <script src="./js/firebase.js"></script>

    <!--  Region Logic (Ensure Firebase is Loaded First) -->
    <script src="./js/region.js"></script>
</body>
</html>

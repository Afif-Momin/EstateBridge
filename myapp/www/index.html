<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstateBridge - Choose Role</title>
    <link rel="stylesheet" href="./css/styles.css">

    <!-- ✅ Firebase SDK v8 (Cordova-Compatible) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- ✅ Cordova Script (Ensure Cordova is Loaded) -->
    <script src="cordova.js"></script>

    <!-- ✅ Firebase Initialization -->
    <script src="./js/firebase.js"></script>
</head>
<body>
    <div class="container">
        <h1>Welcome to EstateBridge</h1>
        <p>Select your role to continue:</p>
        
        <!-- Buyer & Seller Selection -->
        <div class="button-group">
            <button id="buyerBtn" class="btn">Buyer</button>
            <button id="sellerBtn" class="btn btn-secondary">Seller</button>
        </div>

        
    </div>

    <!-- ✅ App Script (Ensuring It Loads at the End) -->
    <script src="./js/app.js"></script>

    <!-- ✅ Debugging to Check Button Elements -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            console.log("✅ DOM Loaded. Checking Buttons...");
            console.log("Buyer Button:", document.getElementById("buyerBtn"));
            console.log("Seller Button:", document.getElementById("sellerBtn"));
        });
    </script>
</body>
</html>

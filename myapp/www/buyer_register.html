<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Register</title>
    <link rel="stylesheet" href="./css/styles.css">

    <!-- ✅ Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- ✅ Firebase Initialization -->
    <script src="./js/firebase.js"></script>
</head>
<body>
    <div class="container">
        <h2>Buyer Register</h2>
        <form id="buyerRegisterForm">
            <input type="text" id="buyerName" name="buyer_name" placeholder="Full Name" required>
            <input type="email" id="buyerEmail" name="buyer_email" placeholder="Email" required>
            <input type="tel" id="buyerMobile" name="buyer_mobile" placeholder="Mobile Number" required>
            <input type="password" id="buyerPassword" name="buyer_password" placeholder="Password" required>
            <input type="text" id="buyerAddress" name="buyer_address" placeholder="Address" required>

            <!-- Country Selection -->
            <label for="buyerCountry">Select Country:</label>
            <select id="buyerCountry" name="buyer_country" required>
                <option value="" disabled selected>Select Country</option>
                <option value="US">United States</option>
                <option value="UK">United Kingdom</option>
                <option value="India">India</option>
                <option value="Canada">Canada</option>
                <option value="Germany">Germany</option>
            </select>

            <!-- State Selection -->
            <label for="buyerState" id="buyerStateLabel" class="hidden">Select State:</label>
            <select id="buyerState" name="buyer_state" class="hidden" required>
                <option value="" disabled selected>Select State</option>
            </select>

            <input type="text" id="buyerCity" name="buyer_city" placeholder="City" required>
            <input type="text" id="buyerPincode" name="buyer_pincode" placeholder="Pincode" required>

            <button type="submit" class="btn">Register</button>
        </form>
        <p>Already have an account? <a href="buyer_login.html">Login here</a></p>
    </div>

    <!-- ✅ JavaScript Files -->
    <script src="./js/app.js"></script>
    <script src="./js/region.js"></script>

    <!-- ✅ Fix State Selection -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            console.log("✅ Buyer Registration Page Loaded!");

            const countrySelect = document.getElementById("buyerCountry");
            const stateSelect = document.getElementById("buyerState");
            const stateLabel = document.getElementById("buyerStateLabel");

            const states = {
                "US": ["California", "Texas", "New York", "Florida", "Illinois"],
                "UK": ["London", "Manchester", "Birmingham", "Liverpool", "Leeds"],
                "India": ["Delhi", "Mumbai", "Bangalore", "Kolkata", "Chennai"],
                "Canada": ["Ontario", "Quebec", "British Columbia", "Alberta", "Manitoba"],
                "Germany": ["Berlin", "Hamburg", "Munich", "Cologne", "Frankfurt"]
            };

            countrySelect.addEventListener("change", function () {
                let selectedCountry = countrySelect.value;
                stateSelect.innerHTML = '<option value="" disabled selected>Select State</option>';

                if (selectedCountry) {
                    states[selectedCountry].forEach(state => {
                        let option = document.createElement("option");
                        option.value = state;
                        option.textContent = state;
                        stateSelect.appendChild(option);
                    });

                    stateSelect.classList.remove("hidden");
                    stateLabel.classList.remove("hidden");
                } else {
                    stateSelect.classList.add("hidden");
                    stateLabel.classList.add("hidden");
                }
            });
        });
    </script>
</body>
</html>

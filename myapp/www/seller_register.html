<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Register</title>
    <link rel="stylesheet" href="./css/styles.css">

    <!-- ✅ Firebase SDKs (For Cordova) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- ✅ Firebase Initialization -->
    <script src="./js/firebase.js"></script>
</head>
<body>
    <div class="container">
        <h2>Seller Register</h2>
        <form id="sellerRegisterForm">
            <input type="text" id="sellerName" name="seller_name" placeholder="Full Name" required>
            <input type="email" id="sellerEmail" name="seller_email" placeholder="Email" required>
            <input type="tel" id="sellerMobile" name="seller_mobile" placeholder="Mobile Number" required>
            <input type="password" id="sellerPassword" name="seller_password" placeholder="Password" required>
            <input type="text" id="sellerAddress" name="seller_address" placeholder="Address" required>

            <!-- Country Selection -->
            <label for="sellerCountry">Select Country:</label>
            <select id="sellerCountry" name="seller_country" required>
                <option value="" disabled selected>Select Country</option>
                <option value="US">United States</option>
                <option value="UK">United Kingdom</option>
                <option value="India">India</option>
                <option value="Canada">Canada</option>
                <option value="Germany">Germany</option>
            </select>

            <!-- State Selection (Fixed Validation Issue) -->
            <label for="sellerState" id="sellerStateLabel">Select State:</label>
            <select id="sellerState" name="seller_state" required>
                <option value="" disabled selected>Select State</option>
            </select>

            <input type="text" id="sellerCity" name="seller_city" placeholder="City" required>
            <input type="text" id="sellerPincode" name="seller_pincode" placeholder="Pincode" required>

            <button type="submit" class="btn">Register</button>
        </form>
        <p>Already have an account? <a href="seller_login.html">Login here</a></p>
    </div>

    <!-- ✅ JavaScript Files -->
    <script src="./js/app.js"></script>

    <!-- ✅ Fix for State Selection -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            console.log("✅ Seller Registration Page Loaded!");

            const countrySelect = document.getElementById("sellerCountry");
            const stateSelect = document.getElementById("sellerState");

            const states = {
                "US": ["California", "Texas", "New York", "Florida", "Illinois"],
                "UK": ["London", "Manchester", "Birmingham", "Liverpool", "Leeds"],
                "India": ["Delhi", "Mumbai", "Bangalore", "Kolkata", "Chennai"],
                "Canada": ["Ontario", "Quebec", "British Columbia", "Alberta", "Manitoba"],
                "Germany": ["Berlin", "Hamburg", "Munich", "Cologne", "Frankfurt"]
            };

            countrySelect.addEventListener("change", function () {
                let selectedCountry = countrySelect.value;
                stateSelect.innerHTML = '<option value="" disabled selected>Select State</option>';

                if (selectedCountry) {
                    states[selectedCountry].forEach(state => {
                        let option = document.createElement("option");
                        option.value = state;
                        option.textContent = state;
                        stateSelect.appendChild(option);
                    });

                    // Auto-select first state
                    stateSelect.selectedIndex = 1;
                }
            });
        });
    </script>
</body>
</html>
